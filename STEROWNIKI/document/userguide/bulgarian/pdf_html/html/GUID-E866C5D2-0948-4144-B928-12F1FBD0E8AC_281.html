<div class="topicRoot" id="GUID-E866C5D2-0948-4144-B928-12F1FBD0E8AC"><div id="breadlist"><p><span class="breadLink" onClick="spanClick('index_body')">Начало</span> &gt; <span class="breadLink" onClick="spanClick('glossary')">Кратък речник</span> &gt; <span>DHCP </span></p></div><div id="pageControlTop"><span onClick="spanClick('GUID-12345221-DD7B-4A2B-92AC-08A7C2BE0A8C_280')"><img src="images/page-back.gif" title="Предишно"/></span><span onClick="spanClick('GUID-2C13C7A1-17F3-43EE-80CB-9ACA0226D5EB_282')"><img src="images/page-next.gif" title="Следващо"/></span></div><div class="title" id="GUID-C0FDBBA9-BF18-4DAA-B5AA-E548945A555E"><h3>DHCP </h3></div><div class="block"><div class="abstract" id="GUID-BBCE66CF-CA7A-4885-BCB6-9F48E0640AA8">Протоколът за динамична конфигурация на хостове (DHCP) е мрежов протокол, използван за конфигуриране на мрежовите устройства така, че да могат да комуникират по IP мрежа. <div class="tipBox"><div class="tipIcon"><img src="images/topic1_icon5.png"/></div><div class="tipBody"><div class="tipInner">За използване на DHCP се свържете с вашия мрежов администратор. </div></div></div> </div><div class="fnOutBox"/></div><p class="goPageTop" onClick="goPageTop()"><span class="pageTopLink">Най-отгоре</span></p></div>
